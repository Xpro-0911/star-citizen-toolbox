<html lang="zh-CN">

<style>
/* Layout: one full-bleed stage; captions float over it and change scale and position per chapter */
:root{
  --night:#04030A;
  --ink:#EEE8DA;
  --ink-dim:rgba(238,232,218,.64);
  --moon:#F2D9A0;
  --line:rgba(238,232,218,.24);
  --f-display:"Big Shoulders Display","Oswald","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","WenQuanYi Zen Hei",serif;
  --f-sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
  --lb:0px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden}
body{font-family:var(--f-sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:var(--night);overflow:hidden;user-select:none;-webkit-user-select:none}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{display:none}
.cap .hl{color:#F2BE64}
.cap.ink,.cap.ink .c{color:#2B2118 !important;text-shadow:none !important}
.cap.ink .hl{color:#B8412B !important}
#caps{position:absolute;left:0;right:0;top:var(--lb);bottom:var(--lb);pointer-events:none;overflow:hidden}
.cap{position:absolute;white-space:pre;display:none;will-change:opacity,transform,filter;line-height:1}
.cap .c{display:inline-block;white-space:pre;will-change:opacity,transform,filter}
.k-mega{font:900 clamp(44px,10vw,220px)/.86 var(--f-display);color:#fff;mix-blend-mode:difference;text-align:center;letter-spacing:-.005em}
.k-outline{font:900 clamp(110px,30vmin,380px)/.8 var(--f-display);color:transparent;-webkit-text-stroke:2px rgba(238,232,218,.95);letter-spacing:.02em}
.k-year{font:900 clamp(84px,21vmin,270px)/.8 var(--f-display);color:transparent;-webkit-text-stroke:1.6px rgba(238,232,218,.92);letter-spacing:.01em}
.k-title{font:700 clamp(26px,5.6vmin,78px)/1 var(--f-display);color:#F7F0E2;letter-spacing:.03em;text-shadow:0 0 30px rgba(0,0,0,.6)}
.k-titlecn{font:900 clamp(24px,4.6vmin,60px)/1.2 var(--f-serif);color:#F7F0E2;letter-spacing:.08em;text-shadow:0 0 30px rgba(0,0,0,.6)}
.k-wide{font:400 clamp(20px,4.2vmin,54px)/1 var(--f-serif);color:#EDE3FF;letter-spacing:.42em;text-shadow:0 0 24px rgba(90,60,255,.55)}

.k-count .c{min-width:.52em;text-align:center}
.k-count .sep{min-width:.2em}
.k-vert{writing-mode:vertical-rl;font:400 clamp(17px,3.2vmin,34px)/1.9 var(--f-serif);color:#FFF1F4;letter-spacing:.34em;text-shadow:0 0 18px rgba(60,20,80,.8)}
.k-vbig{writing-mode:vertical-rl;font:900 clamp(40px,9.5vmin,118px)/1 var(--f-serif);color:transparent;-webkit-text-stroke:1.2px rgba(255,236,240,.9);letter-spacing:.12em}
.k-fcount{font:900 clamp(40px,9vmin,120px)/1 var(--f-display);color:#FFD58A;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,190,90,.5)}
.k-fcount small{display:block;font:600 clamp(11px,1.6vmin,15px)/1.6 var(--f-sans);letter-spacing:.3em;color:var(--ink-dim);text-align:right}
.k-bounce{font:900 clamp(34px,7.8vmin,104px)/1 var(--f-display);color:#FFF4FA;letter-spacing:.04em;text-shadow:0 4px 0 #FF7EB6,0 8px 0 rgba(90,40,120,.5)}

/* start card */

.st-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:36rem;transform:translateY(22vh)}

#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:26px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(4,3,10,.85),rgba(4,3,10,0));opacity:0;transition:opacity .4s ease;pointer-events:none}

#tlFill{position:absolute;left:0;top:14px;height:2px;background:var(--moon);border-radius:2px;width:0}

@media (max-width:560px){#tl .tick{display:none}#tl .tick.major{display:block}}
@media (prefers-reduced-motion:reduce){#start,#bar{transition:none}}

<div id="stage">

  <div id="start">

      <button id="playBtn" type="button" disabled>准备中</button>

    <button id="fs" type="button" aria-label="全屏"><svg viewBox="0 0 16 16"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z"/></svg></button>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   沐瞳十二年 — real-time generated MV
   Part 1: timing, score, audio engine
   ============================================================ */
const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const BPM = 120, BEAT = 60 / BPM, STEP = BEAT / 4, BAR = BEAT * 4;

const SECS = [
  { id: 'prologue', bar: 0,  len: 6, name: '序章' },
  { id: 'y2014',    bar: 6,  len: 8, name: '2014' },
  { id: 'rush',     bar: 14, len: 7, name: '2015' },
  { id: 'mlbb',     bar: 21, len: 9, name: '2016' },
  { id: 'esports',  bar: 30, len: 10, name: '电竞' },
  { id: 'billion',  bar: 40, len: 8, name: '2020' },
  { id: 'mla',      bar: 48, len: 7, name: '2021' },
  { id: 'wor',      bar: 55, len: 7, name: '2023' },
  { id: 'home',     bar: 62, len: 4, name: '2025' },
  { id: 'chess',    bar: 66, len: 4, name: '' },
  { id: 'silver',   bar: 70, len: 4, name: '' },
  { id: 'acecraft', bar: 74, len: 4, name: '' },
  { id: 'm7',       bar: 78, len: 6, name: '2026' },
  { id: 'savvy',    bar: 84, len: 4, name: '' },
  { id: 'asian',    bar: 88, len: 5, name: '' },
  { id: 'zone',     bar: 93, len: 4, name: '' },
  { id: 'outro',    bar: 97, len: 9, name: '尾声' },
];
const TOTAL_BARS = 106, DUR = TOTAL_BARS * BAR, TOTAL_STEPS = TOTAL_BARS * 16;
SECS.forEach((s, i) => { s.i = i; s.t0 = s.bar * BAR; s.t1 = (s.bar + s.len) * BAR; });
const SEC = {}; SECS.forEach(s => SEC[s.id] = s);
function secByBar(b) { for (let i = SECS.length - 1; i >= 0; i--) if (b >= SECS[i].bar) return SECS[i]; return SECS[0]; }

/* ---------- math helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease3 = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut3 = t => 1 - Math.pow(1 - t, 3);
const easeIn3 = t => t * t * t;
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash1 = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- harmony ---------- */
const CH = {
  Dm: { r: 38, v: [50, 57, 62, 65, 69] }, Bb: { r: 34, v: [46, 58, 62, 65, 70] },
  F:  { r: 41, v: [53, 57, 60, 65, 69] }, C:  { r: 36, v: [48, 55, 60, 64, 67] },
  Eb: { r: 39, v: [51, 58, 63, 67, 70] }, A:  { r: 33, v: [45, 57, 61, 64, 69] },
  D:  { r: 38, v: [50, 57, 62, 66, 69] }, Gm: { r: 43, v: [55, 58, 62, 67, 70] },
};
const CPROG = { main: ['Dm', 'Bb', 'F', 'C'], mla: ['Dm', 'C', 'Bb', 'C'], wor: ['Dm', 'Eb', 'Dm', 'C'], chess: ['F', 'C', 'Dm', 'Bb'] };
const SCALE = [2, 4, 5, 7, 9, 10, 0]; // D natural minor pitch classes
const SC_NOTES = []; for (let m = 0; m < 128; m++) if (SCALE.includes(m % 12)) SC_NOTES.push(m);

/* melodies: [step in phrase, midi, length in 16ths] */
const THEME = [[0,69,4],[4,74,4],[8,76,2],[10,77,4],[14,76,2],[16,74,6],[22,72,2],[24,74,4],[28,77,4],[32,72,4],[36,77,4],[40,79,2],[42,81,4],[46,79,2],[48,76,8],[56,74,2],[58,72,2],[60,76,4]];

const KOTO = [[0,69],[2,72],[4,74],[8,72],[10,69],[12,67],[16,65],[18,67],[20,69],[26,67],[28,65],[30,62],[32,65],[34,69],[36,72],[40,74],[42,77],[44,74],[48,72],[52,69],[56,67],[60,69]];
const TOY = [[0,72,2],[2,77,2],[4,81,2],[6,77,2],[8,79,4],[12,76,4],[16,76,2],[18,79,2],[20,84,2],[22,79,2],[24,81,4],[28,79,4],[32,77,2],[34,81,2],[36,86,2],[38,81,2],[40,84,4],[44,81,4],[48,82,4],[52,81,2],[54,79,2],[56,77,4],[60,79,4]];
const MOTIF2 = [[0,81,6],[6,79,2],[8,77,4],[12,76,4],[16,74,6],[22,76,2],[24,77,8]];
const FLUTE = { 64: [81, 12], 80: [79, 8], 88: [77, 8], 96: [86, 16], 112: [84, 8], 120: [81, 8] };
const mapOf = a => { const m = new Map(); a.forEach(n => m.set(n[0], n)); return m; };
const M_THEME = mapOf(THEME), M_FOUND = mapOf(FOUNDERS), M_KOTO = mapOf(KOTO), M_TOY = mapOf(TOY), M_MOT = mapOf(MOTIF2);
const OUTRO_PIANO = { 0: 69, 6: 74, 8: 77, 12: 76, 32: 74, 38: 77, 40: 82, 44: 81, 64: 62, 66: 66, 68: 69, 70: 74, 72: 78 };

function chordAt(bar) {
  const S = secByBar(bar), lb = bar - S.bar;
  switch (S.id) {
    case 'prologue': return lb < 3 ? 'Dm' : lb < 5 ? 'Bb' : 'C';
    case 'rush': return lb === 6 ? 'A' : CPROG.main[lb % 4];
    case 'mla': return CPROG.mla[lb % 4];
    case 'wor': return CPROG.wor[lb % 4];
    case 'home': case 'chess': case 'acecraft': return CPROG.chess[lb % 4];
    case 'silver': return ['Dm', 'Gm', 'A', 'Dm'][lb % 4];
    case 'zone': return ['Dm', 'Eb', 'Dm', 'Eb'][lb % 4];
    case 'outro': return ['Dm', 'Bb', 'F', 'C', 'Dm', 'Bb', 'D', 'D', 'D'][lb];
    default: return CPROG.main[lb % 4];
  }
}
const M_MLBB2 = mapOf([[0,74,6],[6,72,2],[8,69,8],[16,70,6],[22,69,2],[24,65,8],[32,72,6],[38,69,2],[40,65,4],[44,67,4],[48,64,8],[56,67,4],[60,69,4]]);
const M_ESP2 = mapOf([[0,69,8],[8,74,8],[16,74,4],[20,72,4],[24,70,8],[32,72,8],[40,77,8],[48,76,12],[60,74,4]]);
const M_M72 = mapOf([[0,77,4],[4,76,4],[8,74,8],[16,74,4],[20,72,4],[24,70,8],[32,72,4],[36,74,4],[40,77,8],[48,79,8],[56,81,8]]);
const M_ASIA2 = mapOf([[0,81,4],[4,79,4],[8,77,8],[16,77,4],[20,79,4],[24,74,8],[32,72,4],[36,77,4],[40,81,8],[48,79,8],[56,76,8]]);
const HOME_M = [[0,72,4],[4,77,4],[8,81,6],[14,79,2],[16,76,6],[22,77,2],[24,79,8],[32,77,4],[36,81,4],[40,84,6],[46,82,2],[48,81,8],[56,79,4],[60,77,4]];
const M_HOME = mapOf(HOME_M);

/* ---------- the score: one deterministic function per 16th step ---------- */
function gen(st) {
  const bar = st >> 4, s = st & 15, S = secByBar(bar), lb = bar - S.bar, ch = CH[chordAt(bar)], E = [];
  const A = (i, o) => { o = o || {}; o.i = i; E.push(o); return o; };
  const ph = (lb % 4) * 16 + s;
  const tones = [ch.v[1], ch.v[2], ch.v[3], ch.v[4], ch.v[2] + 12, ch.v[4], ch.v[3], ch.v[2]];
  /* a gentle groove: soft kick on the beat, light snare on 2 and 4, sparse hats */
  const groove = (lead, leadUp, arpV) => {
    if ((s & 3) === 0) A('kick', { v: .72 });
    if (s === 4 || s === 12) A('snare', { v: .5 });
    if ((s & 3) === 2) A('hat', { v: .1 });
    if ((s & 3) === 2) A('bass', { n: ch.r + 12, d: 2, v: .5 });
    if (s === 0) { A('sub', { n: ch.r, d: 14, v: .42 }); A('pad', { n: ch.v, d: 16, v: .28 }); }
    if (arpV) A('arp', { n: tones[s & 7] + 12, v: arpV, cut: .45 });
    if (lead) { const th = M_THEME.get(ph); if (th) { A('lead', { n: th[1] + leadUp, d: th[2], v: .45 }); if (lead === 2) A('lead', { n: dia(th[1] + leadUp, -2), d: th[2], v: .22, harm: 1 }); } }
  };
  /* a calm bed: soft pulse, sustained bass, broken chords, one melody with a quiet bell double */
  const calm = (mel, inst, o) => {
    o = o || {};
    if (s === 0) { A('pad', { n: ch.v, d: 16, v: o.pad == null ? .22 : o.pad }); A('sub', { n: ch.r, d: 16, v: .28 }); }
    if (o.pulse && (s === 0 || s === 8)) A('kick', { v: o.pulse });
    if (o.shaker && (s & 1) === 0) A('shaker', { v: o.shaker * ((s & 3) === 2 ? 1 : .6) });
    if (o.arp && (s & 1) === 0) A(o.arpI || 'piano', { n: tones[(s >> 1) & 7] + 12, v: o.arp });
    if (o.choir && s === 0) A('choir', { n: ch.v, d: 16, v: o.choir });
    if (o.strings && s === 0) A('brassL', { n: ch.v.slice(0, 3), d: 16, v: o.strings });
    if (o.taiko && s === 0) A('taiko', { v: o.taiko });
    const m = mel && mel.get(ph); if (m) { A(inst, { n: m[1] + (o.up || 0), d: m[2], v: o.mv || .45 }); if (o.bell) A('bell', { n: m[1] + 12 + (o.up || 0), v: o.bell }); }
  };
  const fill = (from, v0) => { if (s >= from) A('snare', { v: v0 + .04 * (s - from) }); };
  switch (S.id) {
    case 'prologue':
      if (s === 0 && lb === 0) A('drone', { n: 26, d: 16 * 6, v: .26 });
      if (lb >= 1) { if (s === 0 || s === 8) A('heart', { v: .6 }); if (s === 3 || s === 11) A('heart', { v: .35 }); }
      if (s === 0 && (lb === 1 || lb === 3)) A('pad', { n: ch.v, d: 32, v: .17 });
      if (s === 0 && lb === 5) A('pad', { n: ch.v, d: 16, v: .16 });
      if (lb >= 2 && (s === 6 || s === 14)) A('bell', { n: [81, 86, 88, 93, 89, 84][(lb * 2 + (s > 6 ? 1 : 0)) % 6], v: .16 });
      if (lb === 4 && s === 0) A('swell', { d: 32, v: .18 });
      break;
    case 'y2014': {
      const fp = lb * 16 + s;
      if (fp < 80) { const f = M_FOUND.get(fp); if (f) A('piano', { n: f[1], v: .55, tag: 'founder' }); }
      if (s === 0) { A('pad', { n: ch.v, d: 16, v: .17 }); A('piano', { n: ch.r + 12, v: .24 }); }
